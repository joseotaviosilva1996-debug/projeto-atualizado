<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgroNexo - Manejo</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f3f6f3;

            color: #222;

        }


        /* =========================
           TOPO
        ========================= */

        .topo {

            background:
                linear-gradient(
                    135deg,
                    #176b35,
                    #267e45
                );

            color: white;

            padding: 20px 35px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,.15);

        }


        .titulo {

            display: flex;

            align-items: center;

            gap: 13px;

        }


        .icone-topo {

            width: 52px;

            height: 52px;

            background:
                rgba(255,255,255,.15);

            border-radius: 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 29px;

        }


        .titulo h1 {

            font-size: 29px;

        }


        .titulo p {

            margin-top: 4px;

            opacity: .85;

            font-size: 14px;

        }


        /* BOTÃO VOLTAR */

        .botao-voltar {

            border: none;

            background:
                rgba(255,255,255,.15);

            color: white;

            padding: 11px 17px;

            border-radius: 10px;

            font-size: 15px;

            cursor: pointer;

            transition: .2s;

        }


        .botao-voltar:hover {

            background:
                rgba(255,255,255,.25);

            transform: translateX(-2px);

        }


        /* =========================
           CONTEÚDO
        ========================= */

        .conteudo {

            max-width: 1050px;

            margin: 35px auto;

            padding: 0 20px;

        }


        .titulo-pagina {

            margin-bottom: 25px;

        }


        .titulo-pagina h2 {

            color: #176b35;

            font-size: 27px;

        }


        .titulo-pagina p {

            color: #777;

            margin-top: 6px;

        }


        /* =========================
           FORMULÁRIO
        ========================= */

        .card-formulario {

            background: white;

            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.07);

            margin-bottom: 30px;

        }


        .cabecalho-card {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 25px;

            padding-bottom: 18px;

            border-bottom:
                1px solid #e5e9e5;

        }


        .icone-card {

            width: 45px;

            height: 45px;

            border-radius: 12px;

            background: #e6f3e9;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 24px;

        }


        .cabecalho-card h3 {

            color: #176b35;

            font-size: 21px;

        }


        .cabecalho-card p {

            color: #777;

            font-size: 13px;

            margin-top: 3px;

        }


        .form-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

        }


        .campo {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .campo label {

            font-weight: bold;

            font-size: 14px;

            color: #444;

        }


        .campo input,
        .campo select,
        .campo textarea {

            width: 100%;

            padding: 12px 13px;

            border:
                1px solid #d7dfd8;

            border-radius: 10px;

            font-size: 14px;

            outline: none;

            background: white;

            transition: .2s;

        }


        .campo input:focus,
        .campo select:focus,
        .campo textarea:focus {

            border-color: #258247;

            box-shadow:
                0 0 0 3px
                rgba(37,130,71,.10);

        }


        .campo textarea {

            min-height: 105px;

            resize: vertical;

        }


        .campo-completo {

            grid-column: 1 / -1;

        }


        .obrigatorio {

            color: #d62828;

        }


        .botao-salvar {

            margin-top: 22px;

            width: 100%;

            border: none;

            border-radius: 11px;

            padding: 14px;

            background: #258247;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: .2s;

        }


        .botao-salvar:hover {

            background: #1d6e3c;

            transform: translateY(-1px);

        }


        /* =========================
           HISTÓRICO
        ========================= */

        .historico {

            background: white;

            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.07);

        }


        .historico-cabecalho {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 22px;

            padding-bottom: 18px;

            border-bottom:
                1px solid #e5e9e5;

        }


        .historico-titulo {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .historico-titulo .icone {

            width: 45px;

            height: 45px;

            background: #eef5ef;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

        }


        .historico-titulo h3 {

            color: #176b35;

            font-size: 21px;

        }


        .contador {

            background: #e6f3e9;

            color: #176b35;

            border-radius: 20px;

            padding: 7px 12px;

            font-size: 13px;

            font-weight: bold;

        }


        /* ITEM */

        .manejo-item {

            border:
                1px solid #e1e7e2;

            border-radius: 14px;

            padding: 18px;

            margin-bottom: 12px;

            display: flex;

            justify-content: space-between;

            gap: 15px;

            transition: .2s;

        }


        .manejo-item:hover {

            background: #fafcfa;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,.04);

        }


        .manejo-info {

            display: flex;

            gap: 14px;

        }


        .manejo-icone {

            width: 46px;

            height: 46px;

            border-radius: 12px;

            background: #e8f4eb;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

            flex-shrink: 0;

        }


        .manejo-info h4 {

            font-size: 16px;

            margin-bottom: 5px;

            color: #222;

        }


        .manejo-meta {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            color: #777;

            font-size: 13px;

            margin-bottom: 8px;

        }


        .manejo-descricao {

            color: #555;

            font-size: 14px;

            line-height: 1.5;

        }


        .botao-excluir {

            border: none;

            background: #fff0f0;

            color: #c62828;

            width: 38px;

            height: 38px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 16px;

            flex-shrink: 0;

        }


        .botao-excluir:hover {

            background: #ffe0e0;

        }


        /* SEM HISTÓRICO */

        .vazio {

            text-align: center;

            padding: 45px 20px;

            color: #777;

        }


        .vazio .icone {

            font-size: 48px;

            margin-bottom: 10px;

        }


        .vazio h4 {

            color: #444;

            font-size: 17px;

            margin-bottom: 7px;

        }


        .vazio p {

            font-size: 14px;

        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            .topo {

                padding: 16px 20px;

            }


            .titulo h1 {

                font-size: 23px;

            }


            .icone-topo {

                width: 45px;

                height: 45px;

                font-size: 25px;

            }


            .form-grid {

                grid-template-columns: 1fr;

            }


            .campo-completo {

                grid-column: auto;

            }


            .card-formulario,
            .historico {

                padding: 20px;

            }


            .manejo-item {

                align-items: flex-start;

            }

        }


        @media (max-width: 450px) {

            .botao-voltar {

                font-size: 0;

                padding: 11px 13px;

            }


            .botao-voltar::before {

                content: "←";

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     TOPO
========================= -->

<header class="topo">

    <div class="titulo">

        <div class="icone-topo">
            💉
        </div>

        <div>

            <h1>
                Manejo
            </h1>

            <p>
                Controle dos manejos da fazenda
            </p>

        </div>

    </div>


    <button
        class="botao-voltar"
        onclick="voltarInicio()"
    >
        ← Voltar
    </button>

</header>



<main class="conteudo">


    <div class="titulo-pagina">

        <h2>
            Controle de manejos
        </h2>

        <p>
            Registre vacinações, pesagens, tratamentos e outros procedimentos.
        </p>

    </div>



    <!-- =========================
         FORMULÁRIO
    ========================= -->

    <section class="card-formulario">

        <div class="cabecalho-card">

            <div class="icone-card">
                ➕
            </div>

            <div>

                <h3>
                    Registrar manejo
                </h3>

                <p>
                    Adicione um novo procedimento realizado.
                </p>

            </div>

        </div>


        <form id="formManejo">


            <div class="form-grid">


                <!-- TIPO -->

                <div class="campo">

                    <label for="tipoManejo">

                        Tipo de manejo
                        <span class="obrigatorio">*</span>

                    </label>


                    <select
                        id="tipoManejo"
                        required
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="Vacinação">
                            💉 Vacinação
                        </option>

                        <option value="Pesagem">
                            ⚖️ Pesagem
                        </option>

                        <option value="Vermifugação">
                            💊 Vermifugação
                        </option>

                        <option value="Tratamento">
                            🩺 Tratamento
                        </option>

                        <option value="Exame">
                            🔬 Exame
                        </option>

                        <option value="Transferência">
                            🚜 Transferência
                        </option>

                        <option value="Outro">
                            📋 Outro
                        </option>

                    </select>

                </div>



                <!-- ANIMAL -->

                <div class="campo">

                    <label for="animalManejo">

                        Animal
                        <span class="obrigatorio">*</span>

                    </label>


                    <select
                        id="animalManejo"
                        required
                    >

                        <option value="">
                            Selecione um animal
                        </option>

                    </select>

                </div>



                <!-- DATA -->

                <div class="campo">

                    <label for="dataManejo">

                        Data
                        <span class="obrigatorio">*</span>

                    </label>


                    <input
                        type="date"
                        id="dataManejo"
                        required
                    >

                </div>



                <!-- DESCRIÇÃO -->

                <div class="campo campo-completo">

                    <label for="descricaoManejo">

                        Descrição

                    </label>


                    <textarea
                        id="descricaoManejo"
                        placeholder="Ex.: Aplicada vacina contra febre aftosa. Animal apresentou boa reação."
                    ></textarea>

                </div>


            </div>


            <button
                type="submit"
                class="botao-salvar"
            >
                💾 Salvar manejo
            </button>


        </form>

    </section>



    <!-- =========================
         HISTÓRICO
    ========================= -->

    <section class="historico">


        <div class="historico-cabecalho">

            <div class="historico-titulo">

                <div class="icone">
                    📋
                </div>

                <div>

                    <h3>
                        Histórico de manejos
                    </h3>

                </div>

            </div>


            <div
                class="contador"
                id="contadorManejos"
            >
                0 registros
            </div>

        </div>


        <div id="listaManejos">

            <!-- Os manejos aparecem aqui -->

        </div>


    </section>


</main>



<script>


// =====================================================
// FUNÇÃO PARA VOLTAR
// =====================================================

function voltarInicio() {

    window.location.href =
        "index.html";

}



// =====================================================
// PEGAR ANIMAIS CADASTRADOS
// =====================================================

function pegarAnimais() {

    return JSON.parse(
        localStorage.getItem(
            "animaisAgroNexo"
        )
    ) || [];

}



// =====================================================
// PEGAR MANEJOS
// =====================================================

function pegarManejos() {

    return JSON.parse(
        localStorage.getItem(
            "manejosAgroNexo"
        )
    ) || [];

}



// =====================================================
// CARREGAR ANIMAIS NO SELECT
// =====================================================

function carregarAnimais() {


    const select =
        document.getElementById(
            "animalManejo"
        );


    const animais =
        pegarAnimais();


    select.innerHTML = `

        <option value="">
            Selecione um animal
        </option>

    `;


    animais.forEach(
        function(animal) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                animal.id;


            option.textContent =

                (
                    animal.nome
                    ||
                    "Animal sem nome"
                )

                +

                " - Brinco: "

                +

                (
                    animal.brinco
                    ||
                    "-"
                );


            select.appendChild(
                option
            );

        }
    );


}



// =====================================================
// DATA DE HOJE
// =====================================================

function colocarDataHoje() {


    const hoje =
        new Date();


    const ano =
        hoje.getFullYear();


    const mes =
        String(
            hoje.getMonth() + 1
        ).padStart(2, "0");


    const dia =
        String(
            hoje.getDate()
        ).padStart(2, "0");


    document
        .getElementById(
            "dataManejo"
        )
        .value =
            ano +
            "-" +
            mes +
            "-" +
            dia;

}



// =====================================================
// FORMATAR DATA
// =====================================================

function formatarData(data) {


    if (!data) {

        return "-";

    }


    const partes =
        data.split("-");


    if (partes.length !== 3) {

        return data;

    }


    return (
        partes[2]
        +
        "/"
        +
        partes[1]
        +
        "/"
        +
        partes[0]
    );

}



// =====================================================
// ÍCONE DO MANEJO
// =====================================================

function iconeManejo(tipo) {


    const icones = {

        "Vacinação": "💉",

        "Pesagem": "⚖️",

        "Vermifugação": "💊",

        "Tratamento": "🩺",

        "Exame": "🔬",

        "Transferência": "🚜",

        "Outro": "📋"

    };


    return (
        icones[tipo]
        ||
        "📋"
    );

}



// =====================================================
// MOSTRAR HISTÓRICO
// =====================================================

function mostrarHistorico() {


    const lista =
        document.getElementById(
            "listaManejos"
        );


    const contador =
        document.getElementById(
            "contadorManejos"
        );


    const manejos =
        pegarManejos();


    contador.textContent =

        manejos.length
        +
        (
            manejos.length === 1
            ? " registro"
            : " registros"
        );


    // ---------------------------------------------
    // NENHUM MANEJO
    // ---------------------------------------------

    if (manejos.length === 0) {


        lista.innerHTML = `

            <div class="vazio">

                <div class="icone">
                    📋
                </div>

                <h4>
                    Nenhum manejo registrado
                </h4>

                <p>
                    Os manejos que você salvar aparecerão aqui.
                </p>

            </div>

        `;


        return;

    }



    // ---------------------------------------------
    // ORDENAR DO MAIS RECENTE
    // ---------------------------------------------

    manejos.sort(
        function(a, b) {

            return (
                new Date(b.data)
                -
                new Date(a.data)
            );

        }
    );


    lista.innerHTML = "";



    // ---------------------------------------------
    // CRIAR CADA ITEM
    // ---------------------------------------------

    manejos.forEach(
        function(manejo) {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "manejo-item";


            div.innerHTML = `

                <div class="manejo-info">

                    <div class="manejo-icone">

                        ${iconeManejo(
                            manejo.tipo
                        )}

                    </div>


                    <div>

                        <h4>

                            ${
                                manejo.tipo
                                ||
                                "Manejo"
                            }

                        </h4>


                        <div class="manejo-meta">

                            <span>
                                🐂
                                ${
                                    manejo.animalNome
                                    ||
                                    "Animal"
                                }
                            </span>


                            <span>
                                🏷️
                                Brinco:
                                ${
                                    manejo.brinco
                                    ||
                                    "-"
                                }
                            </span>


                            <span>
                                📅
                                ${
                                    formatarData(
                                        manejo.data
                                    )
                                }
                            </span>

                        </div>


                        ${
                            manejo.descricao
                            ?
                            `
                            <div class="manejo-descricao">

                                ${
                                    manejo.descricao
                                }

                            </div>
                            `
                            :
                            ""
                        }

                    </div>

                </div>


                <button
                    class="botao-excluir"
                    onclick="excluirManejo('${manejo.id}')"
                    title="Excluir manejo"
                >
                    🗑️
                </button>

            `;


            lista.appendChild(
                div
            );

        }
    );

}



// =====================================================
// SALVAR MANEJO
// =====================================================

document
    .getElementById(
        "formManejo"
    )
    .addEventListener(
        "submit",
        function(event) {


            event.preventDefault();


            const tipo =
                document
                    .getElementById(
                        "tipoManejo"
                    )
                    .value;


            const animalId =
                document
                    .getElementById(
                        "animalManejo"
                    )
                    .value;


            const data =
                document
                    .getElementById(
                        "dataManejo"
                    )
                    .value;


            const descricao =
                document
                    .getElementById(
                        "descricaoManejo"
                    )
                    .value
                    .trim();


            // -----------------------------------------
            // LOCALIZAR ANIMAL
            // -----------------------------------------

            const animais =
                pegarAnimais();


            const animal =
                animais.find(
                    function(item) {

                        return String(
                            item.id
                        )
                        ===
                        String(
                            animalId
                        );

                    }
                );


            if (!animal) {

                alert(
                    "Selecione um animal."
                );

                return;

            }



            // -----------------------------------------
            // CRIAR MANEJO
            // -----------------------------------------

            const novoManejo = {

                id:
                    Date.now().toString(),

                tipo:
                    tipo,

                animalId:
                    animal.id,

                animalNome:
                    animal.nome
                    ||
                    "Animal sem nome",

                brinco:
                    animal.brinco
                    ||
                    "-",

                data:
                    data,

                descricao:
                    descricao

            };



            // -----------------------------------------
            // SALVAR
            // -----------------------------------------

            const manejos =
                pegarManejos();


            manejos.push(
                novoManejo
            );


            localStorage.setItem(

                "manejosAgroNexo",

                JSON.stringify(
                    manejos
                )

            );



            // -----------------------------------------
            // LIMPAR FORMULÁRIO
            // -----------------------------------------

            document
                .getElementById(
                    "formManejo"
                )
                .reset();


            colocarDataHoje();



            // -----------------------------------------
            // ATUALIZAR HISTÓRICO
            // -----------------------------------------

            mostrarHistorico();


            alert(
                "Manejo salvo com sucesso!"
            );

        }
    );



// =====================================================
// EXCLUIR MANEJO
// =====================================================

function excluirManejo(id) {


    const confirmar =
        confirm(
            "Deseja excluir este registro de manejo?"
        );


    if (!confirmar) {

        return;

    }


    let manejos =
        pegarManejos();


    manejos =
        manejos.filter(
            function(manejo) {

                return (
                    String(
                        manejo.id
                    )
                    !==
                    String(id)
                );

            }
        );


    localStorage.setItem(

        "manejosAgroNexo",

        JSON.stringify(
            manejos
        )

    );


    mostrarHistorico();

}



// =====================================================
// INICIAR PÁGINA
// =====================================================

carregarAnimais();

colocarDataHoje();

mostrarHistorico();


</script>


</body>

</html>
